[project]
name = "compliance-analyst"
version = "0.1.0"
description = "Agentic assessment of AI use cases against security/compliance requirements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
compliance-analyst = "compliance_analyst.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
